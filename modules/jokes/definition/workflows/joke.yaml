kind: Workflow
trigger:
  kind: OnConversationStart
  id: joke
  actions:

    # Read the intake input (topic) as a record via the seam's built-in input tool: PowerFx has no ParseJSON, so the
    # input JSON string is echoed back as a JSON-object string and parsed to a one-row record (PROBE-A).
    - kind: InvokeMcpTool
      id: read_input
      serverUrl: inproc://flowgent
      serverLabel: flowgent
      toolName: flowgent.input
      requireApproval: false
      arguments:
        payload: =System.LastMessage.Text
      output:
        result: Local.intake

    # Tell the joke. agent.name carries "<stepId>|<agentId>" so the provider keys the Demo response by (joke, tell) and
    # attributes telemetry to the comedian agent. The rendered prompt matches the Demo contract "Tell a joke about: <topic>".
    - kind: InvokeAzureAgent
      id: tell
      conversationId: =System.ConversationId
      agent:
        name: tell|comedian
      input:
        messages: =UserMessage(Concatenate("Tell a joke about: ", First(Local.intake).topic))
      output:
        messages: Local.tell

    # Parse the agent's structured answer (a JSON string) into a record so .joke can be read (ParseJSON-free, PROBE-A).
    - kind: InvokeMcpTool
      id: parse_tell
      serverUrl: inproc://flowgent
      serverLabel: flowgent
      toolName: flowgent.parse
      requireApproval: false
      arguments:
        payload: =MessageText(Local.tell)
      output:
        result: Local.tellObj

    - kind: SetVariable
      id: tell_detail
      variable: Global.tell__detail
      value: =First(Local.tellObj).joke
    - kind: SetVariable
      id: tell_snapshot
      variable: Global.tell
      value: =MessageText(Local.tell)

    # Terminal: expose the joke object as the final output and its text as the message/detail.
    - kind: SetVariable
      id: done_final
      variable: Global.__finalOutput
      value: =MessageText(Local.tell)
    - kind: SetVariable
      id: done_message
      variable: Global.__message
      value: =First(Local.tellObj).joke
    - kind: SetVariable
      id: done_id
      variable: Global.__terminalId
      value: ="done"
    - kind: SendActivity
      id: done
      activity:
        text:
          - "{First(Local.tellObj).joke}"
