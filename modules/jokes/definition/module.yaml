# yaml-language-server: $schema=../../../backend/schemas/module.schema.json
#
# Jokes module: a minimal example that turns a topic into a short joke with a single LLM step.
id: jokes
name: Jokes
description: Minimal example module - turns a topic into a short, clean one-liner joke with a single LLM step.

config:
  # Free-form values, available in templates as config.* (never put secrets here).
  style: a short, clean one-liner

agents:
  - id: comedian
    name: Comedian
    group: Entertainers
    role: Comedian
    persona: A witty comedian who keeps it clean and brief.

workflows:
  - id: joke
    file: workflows/joke.yaml
    version: 1
    name: Tell a joke
    description: Turns a topic into a short joke with a single LLM step and ends.
    title: "Joke about {topic}"
    input:
      schema: { file: schemas/joke.input.schema.json }
    terminals:
      - id: done
        outcome: success

samples:
  - samples/joke.samples.yaml
