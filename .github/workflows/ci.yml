name: CI

on:
  push:
    branches: [master]
    paths: ['Flowgent.AppHost/**', 'engine/**', 'gateway/**', 'shared/**', 'tests/**', 'modules/**', 'Flowgent.slnx', 'Directory.*.props', 'nuget.config', 'global.json']
  pull_request:
    branches: [master]
    paths: ['Flowgent.AppHost/**', 'engine/**', 'gateway/**', 'shared/**', 'tests/**', 'modules/**', 'Flowgent.slnx', 'Directory.*.props', 'nuget.config', 'global.json']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Install the SDK pinned in global.json (.NET 10), so the runner's preinstalled
          # .NET 11 preview — which has a StaticWebAssets build bug with Web SDK test
          # projects — is never selected.
          global-json-file: global.json
      - run: dotnet restore Flowgent.slnx
      - run: dotnet build Flowgent.slnx --no-restore
      - run: dotnet test --solution Flowgent.slnx --no-build
