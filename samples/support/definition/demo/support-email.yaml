# yaml-language-server: $schema=../../../../backend/shared/Flowgent.Definitions/Schemas/demo.schema.json
#
# Demo-mode answers of the support-email workflow: used instead of a model when Flowgent:Llm:Provider is Demo.
steps:

  # Prompt: "Subject: ...\n\nBody: ...". Keyword rules pick the category, first match wins.
  classify:
    rules:
      - when: '\btests?\b|flaky|coverage'
        output:
          isCodeRelated: true
          category: QualityTestIssue
          confidenceScore: 0.88
          reasoning: "[Demo] Mentions tests, coverage or flakiness."
      - when: 'frontend|front-end|\.razor|component|\bcss\b|\bui\b|button|render|display'
        output:
          isCodeRelated: true
          category: FrontendBug
          confidenceScore: 0.9
          reasoning: "[Demo] Mentions UI components or rendering."
      - when: 'exception|error|crash|\bnull\b|\bsql\b|\bapi\b|endpoint|database|\bbug\b|latency|controller|injection|timeout'
        output:
          isCodeRelated: true
          category: BackendBug
          confidenceScore: 0.92
          reasoning: "[Demo] Mentions exceptions, APIs or data access."
    output:
      isCodeRelated: false
      category: OutOfScope
      confidenceScore: 0.95
      reasoning: "[Demo] No code-related signal found; looks like a general support request."

  # Prompt: "Subject: ...\n\nBody: ...\n\nComponent: ...". Keyword rules pick the severity.
  resolve:
    extract:
      subject: { field: Subject }
      component: { field: Component }
    rules:
      - when: 'injection|security'
        output:
          rootCauseDescription: '[Demo] Simulated root cause analysis for "{subject}": the defect originates in {component}.'
          affectedComponent: "{component}"
          severityAssessment: Critical
          proposedFixSummary: "[Demo] Apply a targeted fix in {component} and add a regression test."
          requiresEscalation: false
          escalationReason: null
      - when: 'exception|crash'
        output:
          rootCauseDescription: '[Demo] Simulated root cause analysis for "{subject}": the defect originates in {component}.'
          affectedComponent: "{component}"
          severityAssessment: High
          proposedFixSummary: "[Demo] Apply a targeted fix in {component} and add a regression test."
          requiresEscalation: false
          escalationReason: null
    output:
      rootCauseDescription: '[Demo] Simulated root cause analysis for "{subject}": the defect originates in {component}.'
      affectedComponent: "{component}"
      severityAssessment: Medium
      proposedFixSummary: "[Demo] Apply a targeted fix in {component} and add a regression test."
      requiresEscalation: false
      escalationReason: null

  # Prompt: "Component: ...\n\nProposedFix: ...\n\nPath: ...".
  generate_code:
    extract:
      component: { field: Component }
      fix: { field: ProposedFix }
      path: { field: Path }
    output:
      title: "[Demo] Fix {component}"
      description: "{fix}"
      affectedFilePaths: ["{path}"]
      simulatedDiff: "--- a/{path}\n+++ b/{path}\n@@ -1,3 +1,4 @@\n+// [Demo] simulated change: {fix}\n // existing code\n"
