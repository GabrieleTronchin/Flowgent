# Flowgent platform: engine, gateway and dashboard, in Demo mode (no API key). No module is included:
# put your module definitions under ./definitions/<moduleId>/ and register them (see README.md), or add a
# sample overlay from ./samples.
#
#   docker compose up                                        # the empty platform
#   docker compose -f docker-compose.yml -f samples/jokes.yml up    # with the jokes sample
#
# Browser -> dashboard (nginx, :5173) -> gateway (:5080) -> engine
# Images come from GHCR (FLOWGENT_TAG, default "alpha"); add -f docker-compose.build.yml to build them from source.
name: flowgent

services:
  engine:
    image: ghcr.io/gabrieletronchin/flowgent-engine:${FLOWGENT_TAG:-alpha}
    environment:
      # Demo answers agent steps from each module's demo file. Set FLOWGENT_LLM_PROVIDER=OpenAI and
      # FLOWGENT_LLM_APIKEY to use a real model.
      Flowgent__Llm__Provider: ${FLOWGENT_LLM_PROVIDER:-Demo}
      Flowgent__Llm__ApiKey: ${FLOWGENT_LLM_APIKEY:-}
      # Register modules by id here (or in an override file), e.g.:
      #   Flowgent__Modules__0__Id: notes
    volumes:
      # One sub-folder per module id. Not read-only, so sample overlays can mount their folders inside it.
      - ./definitions:/definitions

  gateway:
    image: ghcr.io/gabrieletronchin/flowgent-gateway:${FLOWGENT_TAG:-alpha}
    environment:
      Gateway__Engine__Address: http://engine:8080
    ports:
      - "5080:8080"
    depends_on:
      - engine

  dashboard:
    image: ghcr.io/gabrieletronchin/flowgent-dashboard:${FLOWGENT_TAG:-alpha}
    environment:
      GATEWAY_URL: http://gateway:8080
    ports:
      - "5173:80"
    depends_on:
      - gateway
