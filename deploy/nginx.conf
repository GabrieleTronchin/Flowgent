# Minimal SPA server for the Flowgent dashboard.
# This round is static-only: the gateway reverse-proxy block is intentionally
# NOT wired here (no compose networking yet — see deploy/README.md). The SPA
# talks to the gateway via its build-time/runtime configuration.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any client-side route.
    location / {
        try_files $uri /index.html;
    }
}
